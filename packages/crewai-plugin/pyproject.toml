[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "opensignet-crewai"
version = "0.1.0"
description = "Read-only native CrewAI tools for the OpenSignet MCP server"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "OpenSignet Contributors" }]
keywords = ["opensignet", "crewai", "mcp", "base", "identity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = ["crewai==1.15.21", "mcp==1.28.1"]

[project.urls]
Homepage = "https://opensignet.com"
Repository = "https://github.com/OpenSignetOrg/opensignet"
Issues = "https://github.com/OpenSignetOrg/opensignet/issues"

[project.scripts]
opensignet-crewai = "opensignet_crewai.connector:main"

[tool.hatch.build.targets.wheel]
only-include = [
  "src/opensignet_crewai/__init__.py",
  "src/opensignet_crewai/__main__.py",
  "src/opensignet_crewai/connector.py",
  "src/opensignet_crewai/py.typed",
]
sources = ["src"]

[tool.hatch.build.targets.sdist]
only-include = [
  ".gitignore",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "NOTICE",
  "src/opensignet_crewai/__init__.py",
  "src/opensignet_crewai/__main__.py",
  "src/opensignet_crewai/connector.py",
  "src/opensignet_crewai/py.typed",
]

[tool.ruff]
target-version = "py312"
